map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server_tokens off;

client_max_body_size 10m;

server {
    listen 80;
    listen [::]:80;

    server_name
        findmydoc.ru
        www.findmydoc.ru
        staging.findmydoc.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name findmydoc.ru;

    ssl_certificate
        /etc/letsencrypt/live/findmydoc.ru/fullchain.pem;
    ssl_certificate_key
        /etc/letsencrypt/live/findmydoc.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    resolver 127.0.0.11 valid=30s ipv6=off;

    location ^~ /api/_nuxt_icon/ {
        set $frontend_upstream frontend-prod;

        proxy_pass http://$frontend_upstream:3000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /_private_video/ {
        internal;

        alias /var/lib/findmydoc/media-prod/videos/;

        types {
            video/mp4 mp4;
        }

        default_type application/octet-stream;

        sendfile on;
        autoindex off;

        limit_except GET {
            deny all;
        }

        add_header Cache-Control "private, no-store" always;
        add_header Vary "Cookie" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Disposition "inline" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /api/v1/media/uploads {
        client_max_body_size 12m;

        set $backend_upstream backend-prod;

        proxy_pass http://$backend_upstream:8000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /api/v1/media/video-uploads {
        client_max_body_size 350m;
        client_body_timeout 60s;

        set $backend_upstream backend-prod;

        proxy_pass http://$backend_upstream:8000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Файл принимается backend порциями.
        # Не создаём сначала полную временную копию в Nginx.
        proxy_request_buffering off;

        # Не повторяем автоматически POST с файлом.
        proxy_next_upstream off;

        proxy_read_timeout 930s;
        proxy_send_timeout 930s;
    }

    location /api/ {
        set $backend_upstream backend-prod;

        proxy_pass http://$backend_upstream:8000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For
            $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /docs {
        set $backend_upstream backend-prod;
        proxy_pass http://$backend_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /openapi.json {
        set $backend_upstream backend-prod;
        proxy_pass http://$backend_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/ {
        set $backend_upstream backend-prod;
        proxy_pass http://$backend_upstream:8000;
        proxy_set_header Host $host;
    }

    location / {
        set $frontend_upstream frontend-prod;

        proxy_pass http://$frontend_upstream:3000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For
            $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name www.findmydoc.ru;

    ssl_certificate
        /etc/letsencrypt/live/findmydoc.ru/fullchain.pem;
    ssl_certificate_key
        /etc/letsencrypt/live/findmydoc.ru/privkey.pem;

    return 301 https://findmydoc.ru$request_uri;
}

