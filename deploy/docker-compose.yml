services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - type: bind
        source: ./postgres/init/01-enable-pgcrypto.sql
        target: /docker-entrypoint-initdb.d/01-enable-pgcrypto.sql
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  migrate:
    image: ${BACKEND_IMAGE}
    profiles:
      - tools
    restart: "no"
    env_file:
      - ${BACKEND_ENV_FILE}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command:
      - alembic
      - upgrade
      - head
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    env_file:
      - ${BACKEND_ENV_FILE}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"
        ]
      interval: 15s
      timeout: 7s
      retries: 10
      start_period: 30s
    networks:
      internal:
      proxy:
        aliases:
          - ${BACKEND_NETWORK_ALIAS}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  frontend:
    image: ${FRONTEND_IMAGE}
    restart: unless-stopped
    env_file:
      - ${FRONTEND_ENV_FILE}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
        ]
      interval: 15s
      timeout: 7s
      retries: 10
      start_period: 30s
    networks:
      proxy:
        aliases:
          - ${FRONTEND_NETWORK_ALIAS}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  nginx:
    image: nginx:1.28-alpine
    profiles:
      - edge
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          sleep 6h
          nginx -s reload || true
        done &
        exec nginx -g 'daemon off;'
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    networks:
      - proxy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  certbot:
    image: certbot/certbot:latest
    profiles:
      - edge
    restart: unless-stopped
    entrypoint:
      - /bin/sh
    command:
      - -c
      - |
        trap exit TERM
        while true; do
          certbot renew \
            --webroot \
            --webroot-path=/var/www/certbot \
            --quiet
          sleep 12h &
          wait $${!}
        done
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks:
      - proxy

volumes:
  postgres_data:

  letsencrypt:
    name: findmydoc_letsencrypt
    external: true

  certbot_www:
    name: findmydoc_certbot_www
    external: true

networks:
  internal:
    internal: true

  proxy:
    name: findmydoc_proxy
    external: true