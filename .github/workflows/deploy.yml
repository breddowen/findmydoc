name: Build and deploy

on:
  push:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: findmydoc-vds-deployment
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish images
    runs-on: ubuntu-24.04

    outputs:
      image_prefix: ${{ steps.names.outputs.image_prefix }}
      image_tag: ${{ steps.names.outputs.image_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare image names
        id: names
        shell: bash
        run: |
          REPOSITORY="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"

          echo "image_prefix=ghcr.io/${REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/backend.Dockerfile
          push: true
          tags: |
            ${{ steps.names.outputs.image_prefix }}-backend:${{ steps.names.outputs.image_tag }}
            ${{ steps.names.outputs.image_prefix }}-backend:${{ github.ref_name }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/frontend.Dockerfile
          push: true
          tags: |
            ${{ steps.names.outputs.image_prefix }}-frontend:${{ steps.names.outputs.image_tag }}
            ${{ steps.names.outputs.image_prefix }}-frontend:${{ github.ref_name }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy
    needs:
      - build

    runs-on: ubuntu-24.04

    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine target environment
        id: target
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "name=production" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF_NAME}" == "develop" ]]; then
            echo "name=staging" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported deployment branch: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            | sed 's/\r$//' \
            > ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$VPS_KNOWN_HOSTS" \
            | sed 's/\r$//' \
            > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

          echo "Private key fingerprint:"
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /tmp/deploy-key.pub
          ssh-keygen -lf /tmp/deploy-key.pub
      
      - name: Test SSH authentication
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          echo "GitHub runner public IP:"
          curl --fail --silent --show-error https://api.ipify.org
          echo

          ssh \
            -vvv \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o PasswordAuthentication=no \
            -o PreferredAuthentications=publickey \
            -o StrictHostKeyChecking=yes \
            -p "${VPS_PORT}" \
            "${VPS_USER}@${VPS_HOST}" \
            'echo "SSH authentication successful"; id'
      
      - name: Validate deployment target
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          [[ "${VPS_HOST}" == "159.194.242.7" ]] || {
            echo "VPS_HOST is incorrect"
            exit 1
          }

          [[ "${VPS_PORT}" == "22" ]] || {
            echo "VPS_PORT is incorrect"
            exit 1
          }

          [[ "${VPS_USER}" == "deploy" ]] || {
            echo "VPS_USER is incorrect"
            exit 1
          }

          echo "Deployment target is correct"
      
      - name: Test SSH with explicit target
        shell: bash
        run: |
          ssh \
            -vvv \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o PasswordAuthentication=no \
            -o PreferredAuthentications=publickey \
            -o StrictHostKeyChecking=yes \
            -p 22 \
            deploy@159.194.242.7 \
            'echo "SSH works"; id'

      - name: Upload deployment configuration
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          rsync \
            --archive \
            --compress \
            --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p ${VPS_PORT}" \
            deploy/ \
            "${VPS_USER}@${VPS_HOST}:/opt/findmydoc/deploy/"

      - name: Run deployment 
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }} 
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_USER: ${{ secrets.VPS_USER }}
          TARGET: ${{ steps.target.outputs.name }}
          IMAGE_PREFIX: ${{ needs.build.outputs.image_prefix }}  
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -p "${VPS_PORT}" \
            "${VPS_USER}@${VPS_HOST}" \
            "chmod +x /opt/findmydoc/deploy/scripts/*.sh && \
             /opt/findmydoc/deploy/scripts/deploy.sh \
             '${TARGET}' \
             '${IMAGE_PREFIX}' \
             '${IMAGE_TAG}'"